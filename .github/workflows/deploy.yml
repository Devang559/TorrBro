name: Deploy Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master

jobs:
  # Required GitHub Secrets for signed release APK:
  #   KEYSTORE_BASE64  - base64-encoded .keystore file
  #   KEYSTORE_PASSWORD - keystore password
  #   KEY_ALIAS - key alias name
  #   KEY_PASSWORD - key password
  # If KEYSTORE_BASE64 is unset, the build falls back to the debug keystore.
  build-release-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17
          cache: gradle

      - name: Install npm dependencies
        run: npm ci

      - name: Install Watchman (macOS only)
        if: runner.os == "macOS"
        run: brew install watchman

      - name: Configure Gradle
        run: |
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "android.builder.sdkDownload=false" >> gradle.properties

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/torrbro-release.keystore
          echo "KEYSTORE_PATH=/tmp/torrbro-release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Copy APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk ../../app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ../../app-release.apk
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ../../app-release.apk
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up
        if: always()
        run: rm -f ../../app-release.apk
