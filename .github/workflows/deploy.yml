
name: Deploy Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build, Compress and Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Find and verify APK
        id: apk
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "Expected APK not found: $APK"
            echo "Searching for generated APK files..."
            find android/app/build/outputs -type f -name "*.apk" || true
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Compress APK
        id: compress
        shell: bash
        run: |
          mkdir -p release-assets

          cp "${{ steps.apk.outputs.path }}" release-assets/app-release.apk

          cd release-assets
          zip -9 -X app-release.zip app-release.apk
          cd ..

          echo "zip_path=release-assets/app-release.zip" >> "$GITHUB_OUTPUT"

          echo "Original APK size:"
          ls -lh "${{ steps.apk.outputs.path }}"

          echo "Compressed ZIP size:"
          ls -lh release-assets/app-release.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-files
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.compress.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK and ZIP to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Android Release

            - **app-release.apk** — Install the Android application directly.
            - **app-release.zip** — Download the compressed APK and extract it before installation.
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.compress.outputs.zip_path }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

